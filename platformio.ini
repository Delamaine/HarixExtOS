; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp01_1m

[env]
lib_deps =
  knolleary/PubSubClient@^2.8
  beegee-tokyo/DHT sensor library for ESPx@^1.19
  PaulStoffregen/OneWire@^2.3
  milesburton/DallasTemperature@^4.0

[env:esp8266_generic]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
upload_speed = 115200
board_build.flash_mode = dout
build_flags = -Wno-sign-compare

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
upload_speed = 115200
board_build.flash_mode = dout

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
upload_speed = 115200
board_build.flash_mode = dout

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
upload_speed = 115200
board_build.flash_mode = dout

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -DUNITY_INCLUDE_DOUBLE
lib_ignore = DHTesp, OneWire, DallasTemperature
test_build_src = yes
build_src_filter = -<*> +<api/vars.cpp> +<api/expr.cpp> +<api/block_stack.cpp> +<api/cron.cpp> +<kernel/iot/inbound_queue.cpp> +<kernel/iot/onchange_logic.cpp> +<kernel/iot/relay_logic.cpp> +<kernel/iot/sensor_logic.cpp> +<kernel/crash_log.cpp> -<kernel/iot/onchange.cpp>
